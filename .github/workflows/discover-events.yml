name: Discover event candidates

on:
  schedule:
    # GitHub cron is UTC. 04:00 UTC is around 06:00 in Prague during summer time.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Discover event candidates
        env:
          DISCOVERY_SUMMARY_PATH: discovery-summary.md
        run: npm run discover:events

      - name: Validate data
        run: npm run validate:data

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- data/events.ts data/event-candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit discovered data changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.ts data/event-candidates.json
          git commit -m "Update discovered Za Skálou events"
          git push
